  - hypothesis: "사용자는 금융앱 추천을 불신해서 따르지 않는다"
    result: "축소 — 실행 0/10이지만 이유 대부분이 '본 적 없음'·'시드 부족', 불신은 1명 (SUR-07)"

# ─────────────────────────────────────────────
# 9. 한계
# ─────────────────────────────────────────────
limitations:
  - "표본 n=10, 단답형 설문 — 심층 인터뷰 미실시. 빈도 수치는 방향성 지표로만 사용한다."
  - "분기 문항 오염: 비대상자가 분기 문항에 응답한 사례(R9의 Q5)를 근거에서 제외했다."
  - "Q9 질문문 예시('그냥 샀다')가 응답을 유도했을 가능성이 있다."
  - "대상층의 실제 손실 사례는 아직 없다 (SUR-05는 대상 제외 유형)."
  - "지불의사는 확인되지 않았으며(SUR-08), 무료 서비스 전제(ASM-05)로 흡수한다."
