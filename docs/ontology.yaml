    criteria: "10분 이내 확인으로 확신 획득"
    evidence: [SUR-10]
  - id: expert
    name: "스스로 검증하는 전문가 — 대상 제외"
    respondents: [R1]
    criteria: "백테스트·자체 최적화 모델 등 독자적 검증 수단 보유 (Q4, Q15)"
