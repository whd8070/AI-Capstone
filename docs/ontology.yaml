validation_plan:
  portfolio_hypothesis:
    statement: "Diffusion + 리포트 + 위험관리의 결합이 기존 포트폴리오보다 성과·위험에서 이점이 있는가"
    comparisons: [EW, STABLE, STABLE_RISK, STABLE_REPORT, FULL]
    evaluation:
      horizon_trading_days: 10
      offsets: 10
      cost_scenarios_round_trip_bps: [30, 60]
      metrics: [Sharpe, MDD, volatility, sector_concentration, turnover, CAGR]
      requirements:
        - "동일한 유니버스·기간·가격·거래비용 전제 사용"
        - "훈련 구간에서 조정한 파라미터를 평가 구간에 그대로 적용"
        - "10개 오프셋 결과는 서로 독립 표본으로 간주하지 않음"
        - "리포트가 추가한 성과와 단순 집중도 완화 효과를 분리 비교"
    refs: [LOG-020, LOG-021]
  explanation_hypothesis:
    statement: "근거 추적형 설명이 사용자의 종목 선정·비중 결정 이유 파악에 도움이 되는가"
    tasks: ["선정 이유 식별", "비중 제한 원인 확인", "원문 출처 추적", "전망과 사실 구별"]
    refs: [LOG-005, LOG-022]

scope_and_limitations:
  in_scope:
    - "국내 대형주 리포트의 과거 시점 수집과 단기 신호 구조화"
    - "STABLE 생성 경로와 리포트 정보의 결합 실험"
    - "위험 제약 최적화, 설명 생성, 검증 차단"
    - "오프셋 통합 백테스트와 시점 누출 검사"
  out_of_scope:
    - "실제 증권사 주문 자동 실행"
    - "투자 수익 보장"
    - "개인별 적합성·위험성향을 반영한 맞춤 자문"
    - "무허가 리포트 원문 재배포"
  limitations:
    - "설문 표본 n=10, 단답형 중심이며 사용자 전체에 일반화할 수 없음."
    - "R9의 Q5는 설문 분기 오류로 제외하고 Q11~Q12만 참조."
    - "외부 리포트의 1년치 확보 여부와 실제 이용 가능 시각·이용권한을 확인해야 함."
    - "단기 신호 변환, diffusion 융합 신뢰도, 최적화 계수는 아직 검증하지 않음."
    - "리포트와 diffusion이 같은 정보를 반영할 수 있으므로 독립성 가정은 검증 대상."
    - "생성 시나리오 수가 많다고 실제 시장 예측 오차가 작아지는 것은 아님."
    - "설명 근거의 사실성 검증은 투자 성과 및 미래 전망의 정답 여부를 보장하지 않음."
    - "라이선스·저작권 및 서비스 유형별 금융 규제 검토가 필요함."
