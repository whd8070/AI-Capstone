# 온톨로지 v1 — 포트폴리오 설명 챗봇 도메인
# 근거: 설문조사 10건(2026-09-16 ~ 09-30) + 팀 프로젝트 정의

meta:
  title: "온톨로지 v1 — 포트폴리오 설명 챗봇 도메인"
  version: v1
  date: 2026-09-30
  basis: "설문조사 10건(2026-09-16 ~ 09-30) + 팀 프로젝트 정의"
  parent_docs: []
  child_docs: ["problem-definition.md", "spec-v1.md"]

# 0. 근거 태그 체계 — 저장소의 모든 문서는 주장마다 아래 태그로 근거 등급을 표기한다
evidence_tags:
  SUR: { meaning: "설문조사에서 직접 확인된 사실", status: "검증됨 (n=10 한계 내)" }
  ASM: { meaning: "팀이 설정한 가정", status: "미검증 — 인터뷰 검증 대상" }
  PRJ: { meaning: "프로젝트 정의(팀 합의)에서 온 설계 결정", status: "합의됨" }

# 증거 색인 (SUR)
evidence:
  - id: SUR-01
    content: "자산배분 조언 수신자 4명 중 3명이 신뢰·확신 부재로 전부 실행하지 않음"
    quotes: ["믿음직스럽지 않아서", "지인 의견에 모두 동의할 수 없어서", "확신이 들지 않았기 때문"]
    sources: [R1, R3, R10]
  - id: SUR-02
    content: "제안 검증에 드는 확신 획득 비용이 높음 — 2시간(R1), 며칠(R3), 결국 확신 못 얻음(R6)"
    sources: [R1, R3, R6, R9]
  - id: SUR-03
    content: "매수·매도 결정 직전 30분 행동이 \"그냥 샀다\" 6/10"
    sources: [R1, R2, R5, R7, R8, R6]
  - id: SUR-04
    content: "투자 정보 출처에서 유튜브(4)·커뮤니티(2)가 공식 출처(리포트 1, 공시 1)를 압도"
    sources: ["Q10 집계"]
  - id: SUR-05
    content: "낡은/부정확 정보 기반 투자 판단 실손실 사례"
    quotes: ["클래리티 법안 통과 여부를 보고 이더리움 숏"]
    sources: [R1]
  - id: SUR-06
    content: "생성형 AI를 이미 금융 정보 채널로 사용 4/10 — 자산배분 논의, 시황 확인 루틴, 제도 자격 확인, 정보 탐색 경로"
    sources: [R6, R7, R8, R10]
  - id: SUR-07
    content: "금융앱 추천 포트폴리오를 그대로 실행한 경험 0/10"
    quotes: ["거짓같아서"]
    sources: ["Q8 집계", R2]
  - id: SUR-08
    content: "자산관리·투자 정보에 대한 유료 지불 경험 0/10 (전 도메인)"
    sources: ["Q7 집계", "Q16 집계"]
  - id: SUR-09
    content: "보유 자산 관련 뉴스·시황 확인 루틴 없음 6/10"
    sources: ["Q14 집계"]

# 가정 색인 (ASM) — 인터뷰 검증 백로그
assumptions:
  - id: ASM-01
    hypothesis: "\"그냥 샀다\"(SUR-03)는 확인 필요성을 못 느껴서가 아니라, 확인 비용이 높아 학습된 포기다"
    validation: "인터뷰: 해당 응답자 유형에게 \"왜 확인하지 않았나\" 심층 질문"
  - id: ASM-02
    hypothesis: "추천 비중에 출처가 연결된 설명이 붙으면 실행 확신이 상승한다"
    validation: "프로토타입 A/B 또는 인터뷰 반응 테스트"
  - id: ASM-03
    hypothesis: "생성형 AI 답변(SUR-06)에 대해 사용자는 사실성 검증 수단을 원한다"
    validation: "인터뷰: GPT 사용자 4명 유형 집중 섭외"
  - id: ASM-04
    hypothesis: "뉴스·시황과 비중을 연결한 설명이 \"왜 이 비중인가\"에 대한 이해를 높인다"
    validation: "사용성 테스트"
  - id: ASM-05
    hypothesis: "서비스는 무료 사용을 전제한다 (SUR-08에 근거한 스코프 결정)"
    validation: null   # 결정사항 — 검증 대상 아님

# 1. 개념 (Entities)
entities:
  actors:
    - id: low_engagement_investor
      name: "저관여 개인투자자"
      definition: "투자는 하지만 정보 탐색·검증 루틴이 없는 2030 투자자. 설문 주 표본"
      evidence: [SUR-03, SUR-09]
    - id: advice_channel
      name: "조언 채널"
      definition: "자산배분 제안의 공급자: 유튜브, 지인, 금융앱, 생성형 AI"
      evidence: [SUR-04, SUR-06, SUR-07]
    - id: portfolio_optimizer
      name: "포트폴리오 최적화기"
      definition: "기존 알고리즘. 수치 입력(수익률·공분산 등)으로 투자비중을 산출하는 외부 모듈"
      evidence: [PRJ]
    - id: system_agents
      name: "시스템 에이전트"
      definition: "Research / Explanation / Verification 3역 (spec-v1.md, AGENTS.md 참조)"
      evidence: [PRJ]

  information_objects:
    - id: recommended_portfolio
      name: "추천 포트폴리오"
      definition: "최적화기가 산출한 자산별 투자비중 벡터"
      attributes: [t_opt]   # 산출 기준시점
      evidence: [PRJ]
    - id: market_info_item
      name: "시장 정보 항목"
      definition: "크롤링으로 수집된 뉴스·시황·공시 단위 문서"
      attributes: [source_url, t_pub, t_crawl, source_grade]
      evidence: [PRJ]
    - id: explanation
      name: "설명"
      definition: "비중과 시장 정보를 연결해 생성된 자연어 응답"
      attributes: [claims, source_ids]
      evidence: [PRJ]
    - id: claim
      name: "주장 (claim)"
      definition: "설명 내 검증 가능한 최소 사실 단위"
      attributes: [has_source, has_number]
      evidence: [PRJ]
    - id: verdict
      name: "검증 판정"
      definition: "검증 에이전트가 주장 단위로 내리는 판정"
      attributes: { label: [pass, reject, warn] }   # 통과 / 반려 / 경고
      evidence: [PRJ]

  actions:
    - id: receive_advice
      name: "조언 수신"
      definition: "채널로부터 자산배분 제안을 받음 (4/10)"
      evidence: ["Q1 집계"]
    - id: non_execution
      name: "미실행·부분실행"
      definition: "제안을 받고도 실행하지 않거나 일부만 실행"
      evidence: [SUR-01]
    - id: unverified_execution
      name: "무확인 실행 (\"그냥 삼\")"
      definition: "검증 없이 매수·매도"
      evidence: [SUR-03]
    - id: cross_check
      name: "교차확인"
      definition: "다른 출처·지인·백테스트로 제안을 검증하려는 시도"
      evidence: [SUR-02]
    - id: confidence_failure
      name: "확신 획득 실패"
      definition: "교차확인에도 결론에 도달하지 못함"
      evidence: ["SUR-02 (R6)"]

  judgement_criteria:
    - id: trust
      name: "신뢰 (trust)"
      definition: "제안·정보의 진실성에 대한 사용자의 믿음. 부재 시 미실행 유발"
      evidence: [SUR-01, SUR-07]
    - id: confidence
      name: "확신 (confidence)"
      definition: "실행 결정을 내리기에 충분한 심리적 상태. 획득 비용이 높음"
      evidence: [SUR-02]
    - id: recency
      name: "최신성 (recency)"
      definition: "정보가 현재 시점에 유효한지. 위반 시 실손실"
      evidence: [SUR-05]
    - id: groundedness
      name: "근거성 (groundedness)"
      definition: "주장이 확인 가능한 출처에 연결되는지. 현재 채널 대부분 결여"
      evidence: [SUR-04, ASM-03]

  pain_points:
    - id: PAIN-01
      description: "제안의 근거를 확인할 수 없어 신뢰·확신이 형성되지 않고, 실행이 보류됨"
      evidence: [SUR-01, SUR-07]
    - id: PAIN-02
      description: "스스로 검증하려면 비용이 크고(수 시간~며칠), 실패하기도 함"
      evidence: [SUR-02]
    - id: PAIN-03
      description: "검증 비용 회피의 결과로 무확인 실행이 지배적 행동이 됨"
      evidence: [SUR-03, ASM-01]
    - id: PAIN-04
      description: "낡은 정보를 최신으로 오인해 판단하면 실손실이 발생"
      evidence: [SUR-05]
    - id: PAIN-05
      description: "이미 사용 중인 생성형 AI 채널에는 사실성 검증 계층이 없음"
      evidence: [SUR-06, ASM-03]

# 2. 관계 (Relations)
# status: confirmed = 설문에서 확인된 연결 / assumed = 팀 가정으로만 연결된 구간
# 유일한 assumed 구간(확신 획득 실패 → 무확인 실행)이 인터뷰 최우선 검증 대상이다.
relations:
  - { from: advice_channel, relation: "제공", to: advice_proposal, status: confirmed }
  - { from: advice_proposal, relation: "결여", to: groundedness, status: confirmed, evidence: [SUR-04, SUR-07] }
  - { from: groundedness, relation: "미형성", to: trust_confidence, status: confirmed, evidence: [SUR-01] }
  - { from: trust_confidence, relation: "유발", to: non_execution, status: confirmed, evidence: [PAIN-01] }
  - { from: trust_confidence, relation: "회피경로", to: cross_check, status: confirmed, evidence: [SUR-02] }
  - { from: cross_check, relation: "고비용·실패", to: confidence_failure, status: confirmed, evidence: [PAIN-02] }
  - { from: confidence_failure, relation: "학습된 포기", to: unverified_execution, status: assumed, evidence: [ASM-01, SUR-03, PAIN-03] }
  - { from: market_info_item, relation: "최신성 위반", to: monetary_loss, status: confirmed, evidence: [SUR-05, PAIN-04] }
  - { from: genai_usage, relation: "검증계층 부재", to: PAIN-05, status: confirmed, evidence: [SUR-06] }

# 관계에만 등장하는 보조 노드
auxiliary_nodes:
  advice_proposal: "자산배분 제안"
  trust_confidence: "신뢰·확신 (trust + confidence 결합 노드)"
  monetary_loss: "실손실"
  genai_usage: "생성형 AI 사용"

# 3. 시스템 대응 관계 (온톨로지 → 솔루션 컴포넌트)
system_mapping:
  - target: "최신성 (PAIN-04)"
    component: "Research Agent — 실시간 크롤링 + 시점 메타데이터"
    spec_ref: FR-02
  - target: "근거성 (PAIN-01)"
    component: "Explanation Agent — 비중↔시장정보 연결 설명, 전 주장 출처 첨부"
    spec_ref: FR-03
  - target: "신뢰 (PAIN-05, SUR-05)"
    component: "Verification Agent — 주장-출처 대조, 무근거 주장 차단"
    spec_ref: FR-04
  - target: "확신 비용 (PAIN-02)"
    component: "시스템 전체 — 수 시간짜리 교차확인을 대화 1회로 압축"
    spec_ref: NFR-01

# 4. v1의 한계 (명시)
limitations:
  - "표본 n=10, 저관여층 편중, 전문가급 이상치 1명(R1) 포함 — 빈도 수치는 방향성 지표로만 사용한다."
  - "분기 문항 로직 오염(비대상자 응답)이 있어 Q2·Q5 계열 집계는 보수적으로 해석했다."
  - "페인포인트의 강도(지불의사)는 확인되지 않았다(SUR-08). 본 프로젝트는 이를 무료 서비스 전제(ASM-05)로 흡수한다."
