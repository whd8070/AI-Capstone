# 7. 시스템 대응 — 검증은 신뢰가 아니라 근거성·사실성을 다룬다
# ─────────────────────────────────────────────
system_mapping:
  - target: "최신성 — PAIN-04"
    component: "Research Agent — 실시간 수집 + 시점 메타데이터(t_pub, t_crawl) + 풀 분류"
