name: Unpack evaluation submission
on:
  push:
    branches: [main]
    paths:
      - 'evals/submission_payload.lzma.b64'
permissions:
  contents: write
jobs:
  unpack-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack evaluation artifacts
        run: |
          python - <<'PY'
          import base64, json, lzma, pathlib
          root = pathlib.Path('.')
          data = json.loads(lzma.decompress(base64.b64decode((root/'evals/submission_payload.lzma.b64').read_text())).decode('utf8'))
          for filename, content in data.items():
              path = root / filename
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf8')
          print('Wrote', len(data), 'evaluation files')
          PY
      - name: Install test dependencies
        run: python -m pip install -r evals/requirements-evals.txt
      - name: Run golden tests and Evals
        run: |
          python -m pytest -q tests/test_verification_golden.py tests/test_evals_runner_mutation.py
          python evals/run_evals.py --change "2026-11-17 CI verification of offline Evals" --golden "12/12 golden; 16/16 full tests"
      - name: Commit exact artifacts to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f evals/submission_payload.lzma.b64 .github/workflows/evals-bootstrap.yml
          git add evals tests docs/prompts
          git commit -m "test: add AC-linked golden cases and 36-case offline Evals baseline"
          git push origin HEAD:main
