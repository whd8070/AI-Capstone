name: AC-linked offline Evals

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/evals-ci.yml'
      - 'docs/SPEC.md'
      - 'src/diffusion/kr_report_verification.py'
      - 'src/diffusion/kr_trace.py'
      - 'src/diffusion/kr_report_web.py'
      - 'src/diffusion/kr_report_jobs.py'
      - 'src/diffusion/kr_report_job.py'
      - 'src/diffusion/kr_report_engine.py'
      - 'src/diffusion/test_kr_trace.py'
      - 'src/diffusion/kr_formula.py'
      - 'src/diffusion/kr_formula_agent.py'
      - 'src/diffusion/kr_formula_survey.py'
      - 'src/diffusion/kr_formula_diag.py'
      - 'src/diffusion/kr_formula_sample_signals.csv'
      - 'src/diffusion/test_kr_formula.py'
      - 'src/diffusion/test_kr_formula_agent.py'
      - 'evals/EVAL_DESIGN.md'
      - 'evals/requirements-evals.txt'
      - 'evals/evalset.jsonl'
      - 'evals/formula_evalset.jsonl'
      - 'evals/run_formula_evals.py'
      - 'evals/run_evals.py'
      - 'evals/verification_adapter.py'
      - 'evals/final_adapter.py'
      - 'tests/harness/golden_cases.yaml'
      - 'tests/test_verification_golden.py'
      - 'tests/test_formula_golden.py'
      - 'tests/test_evals_runner_mutation.py'

# CI archives results for every run; only current-source runs may publish JSON/CSV to main.
permissions:
  contents: write

concurrency:
  group: offline-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install evaluation dependencies
        run: |
          python -m pip install -r evals/requirements-evals.txt
          python -m pip install numpy pandas

      - name: Validate canonical SPEC and ontology
        run: |
          test -f docs/SPEC.md
          test ! -f SPEC.md
          python -c "import yaml; data=yaml.safe_load(open('docs/ontology.yaml',encoding='utf-8')); assert isinstance(data,dict) and 'project_log' in data"

      - name: Trace serialization and privacy regression tests
        working-directory: src/diffusion
        run: |
          python -m py_compile kr_trace.py kr_report_web.py kr_report_jobs.py kr_report_job.py kr_report_engine.py
          python -m unittest -v test_kr_trace

      - name: Formula safety and agent-loop regression tests
        working-directory: src/diffusion
        run: python -m unittest -v test_kr_formula test_kr_formula_agent

      - name: Formula-agent deterministic Evals (24 cases)
        run: python evals/run_formula_evals.py

      - name: Golden and mutation tests
        run: python -m pytest -q tests/test_verification_golden.py tests/test_formula_golden.py tests/test_evals_runner_mutation.py

      - name: Offline Evals (not LLM accuracy)
        run: |
          python - <<'PY'
          import subprocess, sys
          from pathlib import Path
          sys.path.insert(0, "evals")
          from run_evals import run, SET, RESULTS
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          subject = subprocess.check_output(["git", "log", "-1", "--format=%s"], text=True).strip()
          baseline = subject == "llmops: freeze final evaluation cases"
          round_run = subject.startswith("R") and " | 대상: " in subject and " | 가설: " in subject
          changes = [f"기준점 {i}/3" for i in range(1, 4)] if baseline else [subject if round_run else "automated offline verification regression"]
          allowed_open = {"F-LIVE-01", "F-LIVE-02"} if baseline or round_run else set()
          for change in changes:
              r = run(SET, change=change, golden="12 verifier + 14 formula golden cases passed", commit=sha, result_dir=RESULTS)
              failed = {c["id"] for c in r["cases"] if not c["pass"]}
              print(change, r["passed"], "/", r["total"], "ASR", r["attack_success_rate"], "failed", sorted(failed), flush=True)
              if failed - allowed_open or any("EVALUATION_EXCEPTION" in c["grade_errors"] for c in r["cases"]):
                  raise SystemExit("Unexpected failure; do not publish as verified results")
              if r["attack_unknown"]:
                  raise SystemExit("Attack outcome unknown")
          PY

      # Archive the outputs of this exact evaluated revision.
      - name: Archive execution results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-evals-${{ github.run_id }}
          path: |
            evals/results/*.json
            evals/results/*.csv
          if-no-files-found: warn
          retention-days: 30

      # Baseline/round runs can have explicitly reported open regressions.
      # Successful CI means valid measurement; inspect Evals pass counts, not just CI color.
      # Publish only when this is still the latest source revision.
      # The final CI run after edits publishes its results once.
      - name: Publish verified Evals results to main
        if: success()
        run: |
          sleep 8
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main advanced during evaluation; skip stale results. A newer run will publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evals/results
          if git diff --cached --quiet; then
            echo "No new evaluation files to publish."
            exit 0
          fi
          git commit -m "evals: record results for evaluated source ${GITHUB_SHA:0:12}"
          git push origin HEAD:main
